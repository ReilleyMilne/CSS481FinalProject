<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Pinder</title>
      <link rel="stylesheet" href="css/base.css" />
      <link rel="stylesheet" href="css/auth.css" />
      <script src="js/store.js" defer></script>
      <script src="js/api.js" defer></script>
      <script src="js/auth.js" defer></script>
  </head>

  <body>
    <div class="auth-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="auth-card">
        <div class="auth-logo">
          <h1>Pinder</h1>
          <p class="tagline">Find friends for your pet</p>
        </div>

        <div id="auth-error" class="error-msg hidden"></div>

        <div id="login-form" class="auth-form">
            <h2>Welcome back</h2>
            <div class="field-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="field-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="password" autocomplete="current-password" />
            </div>
            <button id="login-btn" class="btn-primary" onclick="loginUser()">Sign In</button>
            <p class="auth-switch">New here? <a href="#" onclick="showRegister(); return false;">Create an account</a></p>
        </div>

        <div id="register-form" class="auth-form hidden">
            <h2>Join Pinder</h2>
            <div class="field-row">
                <div class="field-group flex-1">
                    <label for="reg-firstname">First Name</label>
                    <input type="text" id="reg-firstname" placeholder="Jane" autocomplete="given-name" />
                </div>
                <div class="field-group flex-1">
                    <label for="reg-lastname">Last Name</label>
                    <input type="text" id="reg-lastname" placeholder="Smith" autocomplete="family-name" />
                </div>
            </div>
            <div class="field-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
            </div>
            <div class="field-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="password" autocomplete="new-password" />
            </div>
            <button id="register-btn" class="btn-primary" onclick="registerUser()">Create Account</button>
            <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin(); return false;">Sign in</a></p>
        </div>
    </div>
  </body>
</html>
